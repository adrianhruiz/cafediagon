name: Tests y despliegue

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Permisos que necesita el despliegue a GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; no cancela el que ya esta en marcha.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regenerar la carta desde el export del TPV
        run: npm run menu
      # Tambien los menu.<idioma>.json, que salen del mismo script y son lo que
      # carga la web: si se quedan atras, la carta publicada no es la del TPV.
      - name: Comprobar que la carta commiteada esta al dia
        run: git diff --exit-code src/content/
      # El build va antes que los tests a proposito: tests/prerender.test.js lee
      # las doce paginas que deja en dist/, que es lo que se publica de verdad.
      # Sin dist/ esos tests se saltan y el prerender viajaria sin comprobar.
      - run: npm run build
      - run: npm test

  deploy:
    # Solo main despliega: develop se queda en verificacion.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
        # Activa Pages via API si el repo aun no lo tiene: asi el despliegue
        # no depende de que alguien toque Settings a mano.
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: despliegue
        uses: actions/deploy-pages@v4
