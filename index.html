<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- El favicon se ve a 16-32 px: el de 192 pesaba 12,8 KB para eso. El de
       apple-touch-icon si tiene que ser grande, va a la pantalla de inicio. -->
  <!-- %BASE_URL% y no ./: este fichero es la plantilla de la que
       scripts/prerender.mjs saca las doce paginas, y desde /de/aviso-legal/ una
       ruta relativa buscaria las imagenes en /de/aviso-legal/images/. -->
  <link rel="icon" type="image/jpeg" href="%BASE_URL%images/logo-96.jpg" />
  <link rel="apple-touch-icon" href="%BASE_URL%images/logo-192.jpg" />

  <!-- La foto del hero es lo mas grande de la primera pantalla y la pinta React,
       o sea que sin esto no empieza a bajar hasta que el JS ha arrancado.
       Solo la version avif: quien no la soporte se salta la precarga por el type
       y pide el webp a su hora, en vez de bajar las dos. tests/contenido.test.js
       comprueba que el archivo que se nombra aqui existe de verdad. -->
  <link rel="preload" as="image" type="image/avif" fetchpriority="high"
        href="%BASE_URL%images/17-DEx8Xqxsd16-800.avif" />

  <title>Diagon Cafe · Café de especialidad y juegos de mesa en Cala Rajada</title>
  <meta name="description" content="Cafetería en Cala Rajada, Mallorca. Café de especialidad, desayunos, brunch y cientos de juegos de mesa gratis. Mejor Coffee House de Cala Rajada 2026." />
  <meta name="theme-color" content="#202227" />

  <!-- Canonica y traducciones. Lo que hay escrito aqui es lo que le toca a la
       portada en castellano; scripts/prerender.mjs reescribe el bloque entero
       en cada una de las doce paginas, con la direccion de esa pagina en la
       canonica y las de sus tres hermanas en los hreflang.

       Antes las cuatro alternativas se pedian por parametro, y las cuatro
       servian el mismo fichero con la misma canonica apuntando al castellano:
       para Google, tres duplicados de una pagina que se declaraban a si mismos
       duplicados. Ahora cada idioma es un fichero con su canonica propia. -->
  <link rel="canonical" href="https://adrianhruiz.github.io/cafediagon/" />
  <link rel="alternate" hreflang="es" href="https://adrianhruiz.github.io/cafediagon/" />
  <link rel="alternate" hreflang="en" href="https://adrianhruiz.github.io/cafediagon/en/" />
  <link rel="alternate" hreflang="de" href="https://adrianhruiz.github.io/cafediagon/de/" />
  <link rel="alternate" hreflang="ca" href="https://adrianhruiz.github.io/cafediagon/ca/" />
  <link rel="alternate" hreflang="x-default" href="https://adrianhruiz.github.io/cafediagon/" />

  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://adrianhruiz.github.io/cafediagon/" />
  <meta property="og:site_name" content="Diagon Cafe" />
  <meta property="og:title" content="Diagon Cafe · Café de especialidad y juegos de mesa en Cala Rajada" />
  <meta property="og:description" content="Cafetería en Cala Rajada, Mallorca. Café de especialidad, desayunos, brunch y cientos de juegos de mesa gratis. Mejor Coffee House de Cala Rajada 2026." />
  <meta property="og:locale" content="es_ES" />
  <meta property="og:locale:alternate" content="en_GB" />
  <meta property="og:locale:alternate" content="de_DE" />
  <meta property="og:locale:alternate" content="ca_ES" />

  <!-- La tarjeta que se ve al pegar el enlace en WhatsApp, que es por donde se
       comparte un cafe de pueblo. Sin og:image la vista previa sale en gris y
       twitter:card ya prometia una imagen grande.

       La ruta es absoluta porque quien lee esto no es un navegador que este en
       la pagina: es un rastreador que solo tiene el HTML.

       El ancho y el alto los pone scripts/optimize-images.mjs en imagenes.json
       al recortar la tarjeta, y tests/contenido.test.js comprueba que lo que se
       declara aqui es lo que mide el archivo: si no cuadran, Facebook reserva
       un hueco de otro tamano y la vista previa pega un salto.

       No hay twitter:image: X se queda con og:image cuando no lo encuentra, y
       tener la misma URL escrita dos veces es una para olvidarse de cambiar. -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta property="og:image" content="https://adrianhruiz.github.io/cafediagon/images/compartir-1080.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1080" />
  <meta property="og:image:height" content="567" />
  <meta property="og:image:alt" content="La cafetera del Diagon Cafe con las tazas encima, listas para servir" />

  <!-- Ficha para Google: es lo que hace que salgan en busquedas locales.
       Sin aggregateRating a proposito: una valoracion declarada por el propio
       negocio y sin fuente es self-serving review para Google y publicidad no
       verificable para la Directiva Omnibus. La media de Google se dice en el
       texto visible de la seccion "El cafe", donde si consta de donde sale.

       Tampoco lleva acceptsReservations ni paymentAccepted: el cafe no ha
       declarado ninguna de las dos cosas y la ficha no es sitio para suponer.

       Todo lo que sale aqui esta tambien en business.json o en la carta, y
       tests/contenido.test.js compara las dos copias: la ficha es lo que lee
       el buscador y nadie la mira, asi que si se separan no se entera nadie. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "CafeOrCoffeeShop",
    "@id": "https://adrianhruiz.github.io/cafediagon/#negocio",
    "name": "Diagon Cafe",
    "url": "https://adrianhruiz.github.io/cafediagon/",
    "description": "Cafetería de especialidad en Cala Rajada con cientos de juegos de mesa a disposición de los clientes.",
    "image": [
      "https://adrianhruiz.github.io/cafediagon/images/17-DEx8Xqxsd16-800.jpg",
      "https://adrianhruiz.github.io/cafediagon/images/compartir-1080.jpg"
    ],
    "logo": "https://adrianhruiz.github.io/cafediagon/images/logo-192.jpg",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "Carrer de Méndez Núñez, 17, bajo",
      "postalCode": "07590",
      "addressLocality": "Cala Rajada",
      "addressRegion": "Illes Balears",
      "addressCountry": "ES"
    },
    "geo": { "@type": "GeoCoordinates", "latitude": 39.711239, "longitude": 3.4600082 },
    "openingHoursSpecification": [
      {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday", "Wednesday", "Thursday", "Friday", "Sunday"],
        "opens": "09:00",
        "closes": "20:00"
      },
      {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": "Saturday",
        "opens": "08:00",
        "closes": "18:00"
      },
      {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": "Tuesday",
        "opens": "00:00",
        "closes": "00:00"
      }
    ],
    "telephone": "+34628505887",
    "email": "cafeteriadiagon@gmail.com",
    "servesCuisine": ["Café de especialidad", "Desayunos", "Brunch"],
    "currenciesAccepted": "EUR",
    "foundingDate": "2025-01-14",
    "hasMap": "https://maps.app.goo.gl/d2g11FBeK4i8gxYLA",
    "hasMenu": "https://adrianhruiz.github.io/cafediagon/#carta",
    "priceRange": "€",
    "sameAs": ["https://www.instagram.com/cafediagon/"]
  }
  </script>
</head>
<body>
  <!-- Lo que se publica no llega vacio: scripts/prerender.mjs deja aqui dentro
       la pagina entera ya pintada, y el JavaScript solo se engancha a lo que ya
       hay. Aqui habia un bloque de respaldo con la direccion, el telefono y el
       titular, que era lo minimo para quien llegase sin JavaScript; ahora ese
       visitante recibe la web completa, incluidas la carta y las paginas
       legales, y dejarlo puesto significaria ensenarle dos veces lo mismo. -->
  <div id="root"></div>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
