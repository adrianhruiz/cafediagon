<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- El favicon se ve a 16-32 px: el de 192 pesaba 12,8 KB para eso. El de
       apple-touch-icon si tiene que ser grande, va a la pantalla de inicio. -->
  <link rel="icon" type="image/jpeg" href="./images/logo-96.jpg" />
  <link rel="apple-touch-icon" href="./images/logo-192.jpg" />

  <!-- La foto del hero es lo mas grande de la primera pantalla y la pinta React,
       o sea que sin esto no empieza a bajar hasta que el JS ha arrancado.
       Solo la version avif: quien no la soporte se salta la precarga por el type
       y pide el webp a su hora, en vez de bajar las dos. tests/contenido.test.js
       comprueba que el archivo que se nombra aqui existe de verdad. -->
  <link rel="preload" as="image" type="image/avif" fetchpriority="high"
        href="./images/17-DEx8Xqxsd16-800.avif" />

  <title>Diagon Cafe · Café de especialidad y juegos de mesa en Cala Rajada</title>
  <meta name="description" content="Cafetería en Cala Rajada, Mallorca. Café de especialidad, desayunos, brunch y cientos de juegos de mesa gratis. Mejor Coffee House de Cala Rajada 2026." />
  <meta name="theme-color" content="#202227" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Diagon Cafe" />
  <meta property="og:title" content="Diagon Cafe · Café de especialidad y juegos de mesa" />
  <meta property="og:description" content="Cafetería en Cala Rajada, Mallorca. Café de especialidad, desayunos y cientos de juegos de mesa gratis." />
  <meta property="og:locale" content="es_ES" />
  <meta property="og:locale:alternate" content="en_GB" />
  <meta property="og:locale:alternate" content="de_DE" />
  <meta property="og:locale:alternate" content="ca_ES" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Ficha para Google: es lo que hace que salgan en busquedas locales.
       Sin aggregateRating a proposito: una valoracion declarada por el propio
       negocio y sin fuente es self-serving review para Google y publicidad no
       verificable para la Directiva Omnibus. La media de Google se dice en el
       texto visible de la seccion "El cafe", donde si consta de donde sale. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "CafeOrCoffeeShop",
    "name": "Diagon Cafe",
    "description": "Cafetería de especialidad en Cala Rajada con cientos de juegos de mesa a disposición de los clientes.",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "Carrer de Méndez Núñez, 17, bajo",
      "postalCode": "07590",
      "addressLocality": "Cala Rajada",
      "addressRegion": "Illes Balears",
      "addressCountry": "ES"
    },
    "geo": { "@type": "GeoCoordinates", "latitude": 39.711239, "longitude": 3.4600082 },
    "openingHoursSpecification": [
      {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday", "Wednesday", "Thursday", "Friday", "Sunday"],
        "opens": "09:00",
        "closes": "20:00"
      },
      {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": "Saturday",
        "opens": "08:00",
        "closes": "18:00"
      },
      {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": "Tuesday",
        "opens": "00:00",
        "closes": "00:00"
      }
    ],
    "telephone": "+34628505887",
    "email": "cafeteriadiagon@gmail.com",
    "servesCuisine": ["Café de especialidad", "Desayunos", "Brunch"],
    "sameAs": ["https://www.instagram.com/cafediagon/"]
  }
  </script>
</head>
<body>
  <div id="root"></div>

  <!-- La pagina se pinta con JavaScript: sin el, el div de arriba se queda
       vacio. Lo minimo para que quien llegue sin JS pueda venir al cafe. -->
  <noscript>
    <div style="max-width: 40rem; margin: 3rem auto; padding: 0 1.5rem; font-family: system-ui, sans-serif; line-height: 1.6;">
      <h1>Diagon Cafe</h1>
      <p>Cafetería de especialidad con juegos de mesa en Cala Rajada (Mallorca).</p>
      <p>Esta web necesita JavaScript para mostrarse entera. Mientras tanto:</p>
      <ul>
        <li>Carrer de Méndez Núñez, 17, bajo · 07590 Cala Rajada</li>
        <li>Teléfono: <a href="tel:+34628505887">628 50 58 87</a></li>
        <li>Email: <a href="mailto:cafeteriadiagon@gmail.com">cafeteriadiagon@gmail.com</a></li>
        <li><a href="https://www.instagram.com/cafediagon/">Instagram @cafediagon</a></li>
      </ul>
      <p><strong>Alérgenos:</strong> elaboramos en una cocina compartida y no podemos
        garantizar la ausencia de trazas. Si tienes alguna alergia, dínoslo en el local.</p>
      <!-- El aviso legal se pinta con JavaScript: sin el, al menos la
           identificacion que exige el art. 10 de la LSSI tiene que verse. -->
      <p><strong>Titular:</strong> Bárbara María Fuster Galmés · NIF 41537014A ·
        Carrer de Méndez Núñez, 17, 07590 Cala Rajada (Capdepera), Illes Balears</p>
    </div>
  </noscript>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
